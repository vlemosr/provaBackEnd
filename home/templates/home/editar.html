<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Tarefa</title>
</head>
<body>
    <h1>Editar Tarefa</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="titulo" value="{{ tarefa.titulo }}" required>
        <button type="submit">Salvar</button>
        <a href="{% url 'listar_tarefas' %}">Cancelar</a>
    </form>
</body>
</html>
